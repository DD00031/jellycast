overview: "Cast to Google Cast devices from Jellyfin's built-in cast interface"
description: >
  Discovers Google Cast (Chromecast) devices on the local network and exposes each one as a
  session in Jellyfin's existing cast/remote-control interface. Once installed, Chromecast
  devices show up automatically in the cast button already present in jellyfin-web, and
  playback is controlled the same way as casting to any other Jellyfin client session.
category: "General"
changelog: >
  - Initial release: Chromecast discovery, casting and remote control through Jellyfin's
    native session interface.
