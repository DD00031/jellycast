owner: "DD00031"
overview: "Cast to Google Cast devices from Jellyfin's built-in cast interface"
description: >
  Discovers Google Cast (Chromecast) devices on the local network and exposes each one as a
  session in Jellyfin's existing cast/remote-control interface. Once installed, Chromecast
  devices show up automatically in the cast button already present in jellyfin-web, and
  playback is controlled the same way as casting to any other Jellyfin client session.
category: "General"
changelog: >
  v0.1.0.0 - first tagged release, tested end-to-end against real Chromecast devices:
  - Chromecast discovery, casting and remote control through Jellyfin's native session interface.
  - Direct play with correct container detection; HLS transcoding with accurate duration and
    working seek for incompatible sources.
  - Volume, mute, play/pause/stop, and progress reporting wired into Jellyfin's normal
    playback tracking.
  Requires an exact Jellyfin server version match (see README) - built for 10.11.11.
